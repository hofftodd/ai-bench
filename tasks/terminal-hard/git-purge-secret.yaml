name: git-purge-secret
difficulty: hard
max_turns: 40
instruction: |
  The git repository /work/repo leaked an access key. The file config/secrets.env was committed and
  later edited, and the key string itself, AKIA7Q2XEXAMPLE9KEY, was also pasted into deploy.sh.

  Rewrite the repository's history so that:
  - config/secrets.env does not exist in any commit reachable from any branch or tag;
  - every occurrence of AKIA7Q2XEXAMPLE9KEY in any other file, in every such commit, is replaced
    with REDACTED (the rest of each file unchanged);
  - every branch and tag still exists, points at the rewritten version of the same commit, and keeps
    the same number of commits with the same commit messages in the same order;
  - nothing reachable from `git rev-list --all` still contains the key.
  Leave the repository on branch main.
setup: |
  mkdir -p /work/repo && cd /work/repo
  git init -q -b main
  python3 - <<'PY'
  import subprocess, os
  KEY = "AKIA7Q2XEXAMPLE9KEY"
  def run(*a): subprocess.run(a, check=True)
  def commit(msg):
      run("git", "add", "-A"); run("git", "commit", "-qm", msg)
  os.makedirs("config", exist_ok=True)
  subj = []
  for i in range(1, 26):
      with open("app.py", "a") as f: f.write(f"# step {i}\n")
      if i == 3:
          open("deploy.sh", "w").write("#!/bin/sh\necho deploying\n")
      if i == 6:
          open("config/secrets.env", "w").write(f"AWS_KEY={KEY}\nREGION=eu-west-1\n")
          open("config/app.toml", "w").write("debug = false\n")
      if i == 9:
          open("deploy.sh", "a").write(f"export AWS_ACCESS_KEY_ID={KEY}  # temporary\naws s3 sync dist/ s3://bucket\n")
      if i == 14:
          open("config/secrets.env", "a").write("TIMEOUT=30\n")
      if i == 19:
          s = open("deploy.sh").read().replace("# temporary", "# TODO remove " + KEY)
          open("deploy.sh", "w").write(s)
      msg = f"main change {i}"
      commit(msg); subj.append(msg)
      if i == 10:
          run("git", "branch", "feature")
      if i == 12:
          run("git", "tag", "-a", "v1.0", "-m", "release 1.0")
  run("git", "checkout", "-q", "feature")
  fsubj = []
  for j in range(1, 4):
      with open("feature.txt", "a") as f: f.write(f"feature {j}\n")
      if j == 2:
          open("config/secrets.env", "a").write("FEATURE_FLAG=1\n")
      msg = f"feature change {j}"; commit(msg); fsubj.append(msg)
  run("git", "checkout", "-q", "main")
  open("/root/expected/main", "w").write("\n".join(reversed(subj)) + "\n")
  open("/root/expected/feature", "w").write("\n".join(reversed(fsubj)) + "\n")
  open("/root/expected/deploy", "w").write(open("deploy.sh").read().replace(KEY, "REDACTED"))
  open("/root/expected/app", "w").write(open("app.py").read())
  PY
verify: |
  cd /work/repo
  python3 - <<'PY'
  import subprocess, sys
  KEY = "AKIA7Q2XEXAMPLE9KEY"
  def git(*a): return subprocess.run(("git",) + a, capture_output=True, text=True).stdout
  def fail(m): print(m); sys.exit(1)
  if git("rev-parse", "--abbrev-ref", "HEAD").strip() != "main": fail("not on branch main")
  for c in git("rev-list", "--all").split():
      if "config/secrets.env" in git("ls-tree", "-r", "--name-only", c).split():
          fail(f"config/secrets.env still in commit {c[:10]}")
      if git("grep", "-l", KEY, c).strip():
          fail(f"key still in commit {c[:10]}")
  for ref, exp in (("main", "main"), ("feature", "feature")):
      got = git("log", "--format=%s", ref).splitlines()
      want = open(f"/root/expected/{exp}").read().splitlines()
      if ref == "feature":
          got = got[:3]
          if git("log", "--format=%s", "feature~3", "-1").strip() != "main change 10":
              fail("feature no longer branches from 'main change 10'")
      if got != want: fail(f"{ref}: commit messages or count changed")
  if git("log", "-1", "--format=%s", "v1.0^{commit}").strip() != "main change 12": fail("tag v1.0 missing or moved")
  if git("cat-file", "-t", "v1.0").strip() != "tag": fail("v1.0 is no longer an annotated tag")
  if git("show", "main:deploy.sh") != open("/root/expected/deploy").read(): fail("deploy.sh wrong at main")
  if git("show", "main:app.py") != open("/root/expected/app").read(): fail("app.py changed")
  if git("show", "main:config/app.toml") != "debug = false\n": fail("config/app.toml changed")
  print("ok")
  PY
solution: |
  cd repo
  FILTER_BRANCH_SQUELCH_WARNING=1 git filter-branch -f \
    --tree-filter 'rm -f config/secrets.env; [ -f deploy.sh ] && sed -i "s/AKIA7Q2XEXAMPLE9KEY/REDACTED/g" deploy.sh; true' \
    --tag-name-filter cat -- --all >/dev/null 2>&1
  git for-each-ref --format='%(refname)' refs/original/ | xargs -r -n1 git update-ref -d
  git checkout -q main
