solution: |
  cat > /work/cache/ttlcache.py <<'PY'
  import time
  from collections import OrderedDict


  class TTLCache:
      def __init__(self, capacity, ttl, clock=time.monotonic):
          self.capacity, self.ttl, self.clock = capacity, ttl, clock
          self.data = OrderedDict()   # key -> (value, expires_at), least recently used first

      def _live(self, key, now):
          return self.data[key][1] > now

      def _purge(self):
          now = self.clock()
          for k in [k for k in self.data if not self._live(k, now)]:
              del self.data[k]

      def get(self, key, default=None):
          if key not in self.data:
              return default
          if not self._live(key, self.clock()):
              del self.data[key]
              return default
          self.data.move_to_end(key)
          return self.data[key][0]

      def set(self, key, value):
          self.data[key] = (value, self.clock() + self.ttl)
          self.data.move_to_end(key)
          if len(self.data) > self.capacity:
              self._purge()
          while len(self.data) > self.capacity:
              self.data.popitem(last=False)

      def __len__(self):
          now = self.clock()
          return sum(1 for k in self.data if self._live(k, now))

      def keys(self):
          now = self.clock()
          return [k for k in self.data if self._live(k, now)]

      def pop(self, key, default=None):
          if key not in self.data:
              return default
          value, exp = self.data.pop(key)
          return value if exp > self.clock() else default
  PY
