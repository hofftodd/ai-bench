[project]
name = "aibench"
version = "0.1.0"
description = "Pluggable benchmark for local LLM inference: throughput + coding quality across models, backends and hardware"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
    "rich>=13.7",
]

[project.scripts]
aibench = "aibench.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aibench"]
