# aibench config for the Mac Studio (Apple M5 Ultra, 256 GB unified memory, llama.cpp Metal).
# Same model keys, GGUFs and sampling as bench.yaml (the R9700), so results compare model-for-model:
#
#   uv run aibench -c bench-mac.yaml check
#   uv run aibench -c bench-mac.yaml run -m qwen3.8-27b -m flint -m deepseek-v4-flash -s mac --tag mac-baseline
#   uv run aibench -c bench-mac.yaml report --hardware r9700-vulkan --hardware m5ultra-metal
#
# The terminal suites run in Docker sandboxes (OrbStack on this Mac, linux/arm64). GPU power/memory sampling is Linux-only
# (amdgpu sysfs / nvidia-smi), so Mac runs record no peak vram / power / energy.

hardware: m5ultra-metal
results_dir: results
monitor_gpus: none
default_backend: metal
plugins: [plugins]

# `aibench dashboard` (and the rebuild after each run) writes this box's results here, so it never touches the
# R9700's RESULTS.md / dashboard/data. No Docker here, so LiveCodeBench alone makes a model "done".
outputs:
  results_md: RESULTS-mac.md
  data_dir: dashboard/data-mac
  overnight: [livecodebench]
  notes: >-
    **Machine:** Mac Studio, Apple M5 Ultra, 256 GB unified memory, macOS 27.2. Engines: llama.cpp b12098
    (Metal), [DwarfStar](https://github.com/antirez/ds4) (`ds4`), [sushi](https://github.com/beamivalice/sushi)
    1.4.1 (MLX), and [oMLX](https://github.com/jundot/omlx) 0.7.3 (MLX). Terminal suites run in OrbStack (Docker, linux/arm64). No power or memory figures (aibench reads those only on Linux).
    The sushi, ds4 and oMLX models measure speed with `speed-quick-eos`, which is `speed-quick` without `ignore_eos`
    (both servers reject it). [ANALYSIS-mac.md](ANALYSIS-mac.md) interprets these numbers;
    [RESULTS-compare.md](RESULTS-compare.md) puts them next to the R9700's.

  # The current recommendation per role (ANALYSIS-mac.md section 4). The dashboard and RESULTS-mac.md lead with these.
  picks:
    - model: omlx-qwen3.8-flash-next-budget-greedy
      role: Hard problems and planning
      note: >-
        Qwen3.8-Flash-Next on oMLX with greedy decoding and a 24,576-token thinking budget, as ai-swap serves it
        (qwen3.8-flash-next). 90% at 32k, 53 of 60 on LCB-60, ties ds4-q4 in a quarter to half the time. 127 tok/s at 8k
        with MTP as benchmarked; ai-swap serves it without MTP (~102 tok/s, better with several agents).
    - model: omlx-flint
      role: Executors, fast all-round
      note: >-
        flint on oMLX: 77% at 64k in 48 min, 96.3% terminal-x3, 161 tok/s at 8k and 351 tok/s in total with
        8 requests in flight, from 23 GB.
    - model: ds4-q4
      role: Second opinion, escalation
      note: >-
        DeepSeek V4 Flash Q4 on DwarfStar: 93.3% at 64k (86.7% on LCB-60), 100% terminal-x3. A different model
        that fails on different problems, but ~4x slower than tuned Flash-Next.
    - model: qwen3.8-27b
      role: Hard problems, small footprint
      note: >-
        86.7% at 128k from 17.5 GB, but 39k-token answers: give it a 128k budget. oMLX doubles its speed at 8k.

# The R9700's published results (committed models.csv) next to this box's, written to RESULTS-compare.md.
compare:
  label: Mac
  out: RESULTS-compare.md
  baseline: {label: R9700, csv: dashboard/data/models.csv}
  pairs:                          # Mac model -> R9700 model: same network, different engine or quant
    ds4-q2: deepseek-v4-flash
    ds4-q4: deepseek-v4-flash
    sushi-qwen3.8-flash-next-4bpw: strata
    qwen3.8-flash-next: strata
    omlx-qwen3.8-flash-next-mtp: strata
  notes: >-
    **R9700:** Radeon AI PRO R9700 (32 GB) on llama.cpp b11850 (Vulkan), with Strata for Qwen3.8-Flash-Next.
    **Mac:** Mac Studio M5 Ultra (256 GB unified memory) on llama.cpp b12098 (Metal), DwarfStar, sushi and oMLX (MLX).
    The R9700's llama-bench numbers aren't in its models.csv yet (they arrive when its dashboard is next rebuilt);
    [ANALYSIS-compare.md](ANALYSIS-compare.md) quotes them from RESULTS.md and interprets the tables.

# Reserve this Mac's ai-swap for each run (aibench/reserve.py) and unload its models, so the
# engines started below get the memory and agents can't add load mid-run. Released at the end,
# which brings ai-swap's resident models back.
reserve:
  url: http://localhost:8080
  unload: true

backends:
  # The Mac's own ai-swap, for checking a model as agents get it. Not exclusive: the reservation above
  # already unloads everything, and requests carry the run's token.
  swap:
    type: ai-swap
    base_url: http://localhost:8080/v1

  # Started and stopped by aibench, one model at a time. Flags mirror llama-swap's `server` macro on
  # the R9700 (q8_0 KV cache, flash attention, jinja templates, 4 slots sharing one KV pool).
  metal:
    type: llama-server
    binary: ~/.local/bin/llama-server
    port: 5896
    args: [--n-gpu-layers, 99, --flash-attn, auto, --jinja, --parallel, 4,
           --cache-type-k, q8_0, --cache-type-v, q8_0]
    startup_timeout: 1800     # DeepSeek reads ~91 GB on first load

  # llama.cpp b12192, built beside the b12098 above (~/src/llama.cpp-b12192) for Ripple-65B, which
  # needs b12167+. Same flags as `metal`, so the older llama.cpp results stay comparable.
  metal-b12192:
    type: llama-server
    binary: ~/src/llama.cpp-b12192/build/bin/llama-server
    port: 5897
    args: [--n-gpu-layers, 99, --flash-attn, auto, --jinja, --parallel, 4,
           --cache-type-k, q8_0, --cache-type-v, q8_0]
    startup_timeout: 1800

  # llama.cpp master 2e779d5e7 (2026-11-24), for Ripple's DFlash2 drafter: b12192 predates Ripple support
  # (#31904, Nov 15) and aborts loading it (GGML_ASSERT(obj_new) in build_dflash2_selector).
  metal-1124:
    type: llama-server
    binary: ~/src/llama.cpp-1124/build/bin/llama-server
    port: 5896
    args: [--n-gpu-layers, 99, --flash-attn, auto, --jinja, --parallel, 4,
           --cache-type-k, q8_0, --cache-type-v, q8_0]
    startup_timeout: 1800

  # llama.cpp at ggml-org/llama.cpp#32187 (a45f662, unmerged: "model : add Inkling 2 (stacked on
  # Inkling 1)", by unsloth), built as a worktree in ~/src/llama.cpp-inkling2-32187 for Inkling 2 Small;
  # no release has the inkling2 architecture yet. It is the PR unsloth's GGUFs were made with: #32217
  # (~/src/llama.cpp-inkling2) reads different metadata keys and can't load them. Its banded flash
  # attention has no Metal kernel, so that op runs on the CPU: speed here understates the hardware.
  # Same flags as `metal` except the KV cache, which stays F16: the model "does not support a quantized
  # V cache" (only 8 of its 48 layers are global, so F16 costs ~6 GB at 196k). Results on it are
  # provisional until the PR is merged.
  metal-inkling2:
    type: llama-server
    binary: ~/src/llama.cpp-inkling2-32187/build/bin/llama-server
    port: 5898
    args: [--n-gpu-layers, 99, --flash-attn, auto, --jinja, --parallel, 4]
    startup_timeout: 1800

  # sushi (MLX, https://github.com/beamivalice/sushi, Homebrew beamivalice/tap). Serves one pack; the
  # model's `gguf:` holds the pack directory. Qwen/MiMo run their native MTP head by default.
  sushi:
    type: process
    start: sushi --serve --model {gguf} --host {host} --port {port} --no-vision
    port: 12345
    startup_timeout: 1800

  # DwarfStar (https://github.com/antirez/ds4, ~/src/ds4), Metal. --batched-session 4 lets it take
  # 4 requests at once, like the llama.cpp backends' 4 slots.
  ds4:
    type: process
    start: ds4-server --metal -m {gguf} --host {host} --port {port} -c 262144 --batched-session 4
    port: 8000
    startup_timeout: 1800

  # oMLX (https://github.com/jundot/omlx, Homebrew jundot/omlx), MLX. Serves every model directory under
  # {gguf} (~/models/omlx holds symlinks named after the model ids). Up to 8 requests at once by default.
  # Its SSD prompt cache goes to one folder capped at 50 GB: left to itself it grew to ~1 TB over the
  # Nov 18-19 queues (cleared 2026-11-19). Benchmark prompts rarely repeat, so a small cache costs nothing.
  omlx:
    type: process
    start: omlx serve --model-dir {gguf} --host {host} --port {port} --headless
           --paged-ssd-cache-dir ~/.omlx/cache/aibench --paged-ssd-cache-max-size 50GB
    port: 8010
    startup_timeout: 1800

  # Splash 1.7.0 (https://github.com/incoai/splash, Homebrew incoai/tap/splash): Metal engine with DFlash2
  # speculative decoding. Serves the local GGUF in {gguf} with its family's draft from the Hugging Face cache;
  # {model_id} must be OWNER/REPO (Splash's API name). Text only, no idle unload, no chat page. Up to 32
  # requests at once, batched. Its SSD cache is capped (auto, at most 32 GiB) and dropped at exit.
  splash:
    type: process
    start: splash serve --model {model_id} --model-dir {gguf} --host {host} --port {port}
           --language-only --idle-release off --no-webui --max-context 128K
    port: 8020
    health_url: http://127.0.0.1:8020/ready
    startup_timeout: 3600     # the first start prepares (links and checks) the GGUF

  # Splash 1.7.2 (2026-11-24: Inkling 2 Mini with DFlash2) unpacked beside Homebrew's 1.7.0, which serves
  # ai-swap's flint. The wrapper gives it its own HOME so its links, runtime and caches stay apart.
  splash-172:
    type: process
    start: ~/src/splash-1.7.2/bin/splash serve --model {model_id} --model-dir {gguf} --host {host} --port {port}
           --language-only --idle-release off --no-webui --max-context 128K
    port: 8031                # 8021 answers on this Mac (a service lsof doesn't show)
    health_url: http://127.0.0.1:8031/ready
    startup_timeout: 3600

models:
  qwen3.8-27b:
    backend: metal
    id: qwen3.8-27b
    gguf: ~/models/qwen3.8-27b/Qwen3.8-27B-UD-Q4_K_XL.gguf
    max_tokens: 32768
    params: {temperature: 0.6, top_p: 0.95, top_k: 20}   # Qwen thinking-mode defaults
    # 4 slots x 135,168: room for a 128k answer plus its prompt in each (llama-server splits ctx over slots)
    args: [--ctx-size, 540672, --model-draft, ~/models/qwen3.8-27b/MTP/mtp-Qwen3.8-27B-Q4_0.gguf,
           --spec-type, draft-mtp]

  # Ripple-65B Preview (Ricursive, Nov 2026): 65B dense, Apache-2.0, post-trained for agentic coding.
  # AtomicChat's imatrix AD-Q4_K_M (40.4 GB). Ricursive publishes no sampling defaults; these are ours.
  ripple-65b:
    backend: metal-b12192
    id: ripple-65b
    gguf: ~/models/ripple-65b/Ripple-65B-Preview-AD-Q4_K_M.gguf
    max_tokens: 32768
    params: {temperature: 1.0, top_p: 0.95}
    args: [--ctx-size, 540672]        # 4 slots x 135,168 (see qwen3.8-27b)
  # The same with Ricursive's DFlash2 drafter (ashbash's GGUF conversion, Q8_0, 4.3 GB). llama.cpp loads
  # it as a dflash drafter but applies RoPE to draft layer 4 and gives the full-attention layer the whole
  # context (the recipe: no RoPE there, last 16,384 tokens), so acceptance may be below the reference.
  # Output is the target's either way. keep_reasoning: the template re-inserts reasoning_content.
  # Ripple on llama.cpp master (metal-1124), alone and with Ricursive's DFlash2 drafter converted by that
  # build's convert_hf_to_gguf.py (#32363 fixed the drafter's NoPE metadata after ashbash's Nov 6 GGUF).
  ripple-65b-m1124:
    backend: metal-1124
    id: ripple-65b
    gguf: ~/models/ripple-65b/Ripple-65B-Preview-AD-Q4_K_M.gguf
    max_tokens: 32768
    params: {temperature: 1.0, top_p: 0.95, keep_reasoning: true}
    args: [--ctx-size, 540672]
  ripple-65b-dflash2:
    backend: metal-1124
    id: ripple-65b
    gguf: ~/models/ripple-65b/Ripple-65B-Preview-AD-Q4_K_M.gguf
    max_tokens: 32768
    params: {temperature: 1.0, top_p: 0.95, keep_reasoning: true}
    args: [--ctx-size, 540672, --model-draft, ~/models/ripple-65b/Ripple-65B-Preview-DFlash2-m1124-Q8_0.gguf,
           --spec-type, draft-dflash2]
  ripple-65b-dflash:
    backend: metal-b12192
    id: ripple-65b
    gguf: ~/models/ripple-65b/Ripple-65B-Preview-AD-Q4_K_M.gguf
    max_tokens: 32768
    params: {temperature: 1.0, top_p: 0.95, keep_reasoning: true}
    args: [--ctx-size, 540672, --model-draft, ~/models/ripple-65b/Ripple-65B-Preview-DFlash2-Q8_0.gguf,
           --spec-type, draft-dflash]

  # Inkling 2 Small (Thinking Machines, Nov 2026): 594B total / 17B active MoE (384 experts, top 8),
  # hybrid local/global attention, Apache-2.0. unsloth's UD-Q2_K_XL (205 GB, 6 shards); the 4-bit
  # quants (354+ GB) don't fit. Text only (no mmproj). Needs the metal-inkling2 build (unmerged PR).
  # Sampling and reasoning effort are the model card's: temp 1.0, top_p 1.0, no top_k/min_p, "high".
  # 4 slots x 49,152: room for a 32k answer plus its prompt, with ~35 GB left over the weights.
  inkling-2-small:
    backend: metal-inkling2
    id: inkling-2-small
    gguf: ~/models/inkling-2-small/UD-Q2_K_XL/Inkling-2-Small-UD-Q2_K_XL-00001-of-00006.gguf
    max_tokens: 32768
    params: {temperature: 1.0, top_p: 1.0, top_k: 0, min_p: 0.0}
    args: [--ctx-size, 196608, --chat-template-kwargs, '{"reasoning_effort":"high"}']

  # Nemotron 3.5 Super VL 120B-A12B (NVIDIA, Oct 2026): hybrid Mamba MoE (nemotron_h_moe), 12B active.
  # ggml-org Q4_0 (72 GB) with its MTP drafter; no mmproj, so text only. Needs b12192. The model card
  # gives no sampling defaults; these are ours.
  nemotron-3.5-super-vl:
    backend: metal-b12192
    id: nemotron-3.5-super-vl
    gguf: ~/models/nemotron-3.5-super-vl/NVIDIA-Nemotron-3.5-Super-VL-120B-A12B-Q4_0.gguf
    max_tokens: 32768
    params: {temperature: 1.0, top_p: 0.95}
    args: [--ctx-size, 540672, --model-draft,
           ~/models/nemotron-3.5-super-vl/mtp-NVIDIA-Nemotron-3.5-Super-VL-120B-A12B-Q4_0.gguf,
           --spec-type, draft-mtp]

  flint:
    backend: metal
    id: flint
    gguf: ~/models/flint/flint-UD-Q4_K_XL.gguf
    max_tokens: 32768
    params: {temperature: 1.0, top_p: 0.95, top_k: 20, keep_reasoning: true}   # per Recursive/Unsloth
    args: [--ctx-size, 540672]        # 4 slots x 135,168 (see qwen3.8-27b)

  # Qwen3.8-Flash-Next on stock llama.cpp, to see whether sushi's 63-70% LCB (vs Strata's 83.3% on the
  # R9700) comes from sushi. Same sampling as the sushi runs. No MTP drafter: Unsloth's heads need their
  # llama.cpp fork for this architecture (qwen4exp), and drafting doesn't change the output anyway.
  qwen3.8-flash-next:
    backend: metal
    id: qwen3.8-flash-next
    gguf: ~/models/qwen3.8-flash-next/UD-Q4_K_XL/Qwen3.8-Flash-Next-UD-Q4_K_XL-00001-of-00004.gguf
    max_tokens: 32768
    params: {temperature: 1.0, top_p: 0.95, top_k: 20}   # Qwen's thinking-mode defaults, as on sushi
    args: [--ctx-size, 540672]        # 4 slots x 135,168 (see qwen3.8-27b)

  # ThinkingCap-Qwen3.8-Flash-Next (BottleCap AI, Nov 2026): a finetune of the model above that thinks
  # less (model card: -40.9% thinking tokens on LiveCodeBench v6, 91.9 -> 90.9%). bottlecapai's own
  # Q4_K_M (113 GB, 8 shards); they publish no MLX build. Same engine, flags and sampling as
  # qwen3.8-flash-next (the card's are Qwen's: temp 1.0, top_p 0.95, top_k 20, min_p 0, effort xhigh,
  # the template default), so the two compare directly; the base ran Unsloth's UD-Q4_K_XL, though.
  # No MTP drafter, as above. The card checked llama.cpp at 5f5acfe, which b12098 contains.
  thinkingcap-qwen3.8-flash-next:
    backend: metal
    id: thinkingcap-qwen3.8-flash-next
    gguf: ~/models/thinkingcap-qwen3.8-flash-next/Q4_K_M/ThinkingCap-Qwen3.8-Flash-Next-Q4_K_M-00001-of-00008.gguf
    max_tokens: 32768
    params: {temperature: 1.0, top_p: 0.95, top_k: 20, min_p: 0.0}
    args: [--ctx-size, 540672]        # 4 slots x 135,168 (see qwen3.8-27b)

  # ThinkingCap with Strata's thinking budget. Strata (serve/server.py, 0.1.48) keeps a quarter of max_tokens for
  # the answer: past max_tokens - max_tokens/4 of thinking it writes a wrap-up sentence and </think> and lets the
  # model answer. On the R9700's LCB run that fired on 12 of 30 problems and 8 of them were still solved; the Mac
  # engines, with no budget, had 14 of 30 cut off at 32k. llama.cpp's budget is per server, so one entry per
  # budget: `-budget` for livecodebench (32k -> 24,576), `-budget64k` for livecodebench-64k (64k -> 49,152).
  # The message is Strata's REASONING_WRAP_UP (llama.cpp adds the end-of-thinking tag after it).
  thinkingcap-qwen3.8-flash-next-budget: &tc-budget
    backend: metal
    id: thinkingcap-qwen3.8-flash-next
    gguf: ~/models/thinkingcap-qwen3.8-flash-next/Q4_K_M/ThinkingCap-Qwen3.8-Flash-Next-Q4_K_M-00001-of-00008.gguf
    max_tokens: 32768
    params: {temperature: 1.0, top_p: 0.95, top_k: 20, min_p: 0.0}
    args: [--ctx-size, 540672, --reasoning-budget, 24576,
           --reasoning-budget-message, "\n\nI have thought about this long enough; time to give my answer.\n"]
  thinkingcap-qwen3.8-flash-next-budget64k:
    <<: *tc-budget
    args: [--ctx-size, 540672, --reasoning-budget, 49152,
           --reasoning-budget-message, "\n\nI have thought about this long enough; time to give my answer.\n"]

  # On the R9700, experts of 34 of 43 layers ran from system RAM (--n-cpu-moe 34). Here the whole
  # model sits in unified memory, so this is the most interesting speed comparison.
  deepseek-v4-flash:
    backend: metal
    id: deepseek-v4-flash
    gguf: ~/models/deepseek-v4-flash/UD-Q2_K_XL/DeepSeek-V4-Flash-UD-Q2_K_XL-00001-of-00003.gguf
    max_tokens: 32768
    params: {temperature: 1.0, top_p: 1.0}       # DeepSeek's recommended sampling
    args: [--ctx-size, 540672]        # 4 slots x 135,168 (see qwen3.8-27b); the R9700 used 200,704 over 3

  # DeepSeek V4 Flash on DwarfStar, with antirez's own GGUFs (downloaded by `ds4-download`).
  ds4-q2:
    backend: ds4
    id: deepseek-v4-flash
    gguf: ~/models/ds4/DeepSeek-V4-Flash-IQ2XXS-w2Q2K-AProjQ8-SExpQ8-OutQ8-chat-v2-imatrix-0731.gguf
    max_tokens: 32768
    params: {temperature: 1.0, top_p: 1.0}
  ds4-q4:
    backend: ds4
    id: deepseek-v4-flash
    gguf: ~/models/ds4/DeepSeek-V4-Flash-Q4KExperts-F16HC-F16Compressor-F16Indexer-Q8Attn-Q8Shared-Q8Out-chat-v2-imatrix-0731.gguf
    max_tokens: 32768
    params: {temperature: 1.0, top_p: 1.0}

  # sushi packs (`sushi pull`, into ~/.sushi/models). Sampling: each model's vendor defaults.
  sushi-qwen3.8-flash-next-4bpw:     # the model Strata/Avalon ran on the R9700 (at ~3 bits)
    backend: sushi
    id: qwen3.8-flash-next
    gguf: ~/.sushi/models/beamster/Qwen3.8-Flash-Next-Sushi-4bpw
    max_tokens: 32768
    params: {temperature: 1.0, top_p: 0.95, top_k: 20}   # same as avalon/strata
  sushi-glm-5.3-flash:
    backend: sushi
    id: glm-5.3-flash
    gguf: ~/.sushi/models/beamster/GLM-5.3-Flash-Sushi-2.4bpw
    max_tokens: 32768
    params: {temperature: 1.0, top_p: 0.95}   # pack generation_config.json
  sushi-mimo-v2.6-flash:
    backend: sushi
    id: mimo-v2.6-flash
    gguf: ~/.sushi/models/beamster/MiMo-V2.6-Flash-Sushi-2.3bpw
    max_tokens: 32768
    params: {temperature: 1.0, top_p: 0.95}   # pack generation_config.json

  # Thinking Machines' Inkling-Small (276B total / 12B active, Apache-2.0) as mlx-community's 4-bit MLX
  # build (experts 4-bit, the rest 8-bit; 153 GB). llama.cpp has no Inkling support on Metal, so oMLX.
  # No recommended sampling is published; the chat template's default reasoning_effort (0.9) applies.
  inkling-small:
    backend: omlx
    id: inkling-small
    gguf: ~/models/omlx
    max_tokens: 32768
    params: {temperature: 1.0}

  # Qwen3.8-Flash-Next as oMLX's own oQ4e quant (Jundot/Qwen3.8-Flash-Next-oQ4e-mtp, oMLX 0.7.3, 4.8 bits/weight,
  # 108 GB), to judge oMLX against llama.cpp and sushi on the same model. Two ids for the same files (symlinks in
  # ~/models/omlx): MTP off, and MTP on (`mtp_enabled` in ~/.omlx/model_settings.json; adaptive depth).
  omlx-qwen3.8-flash-next:
    backend: omlx
    id: qwen3.8-flash-next-oq4e
    gguf: ~/models/omlx
    max_tokens: 32768
    params: {temperature: 1.0, top_p: 0.95, top_k: 20}   # Qwen's thinking-mode defaults, as on llama.cpp and sushi
  omlx-qwen3.8-flash-next-mtp:
    backend: omlx
    id: qwen3.8-flash-next-oq4e-mtp
    gguf: ~/models/omlx
    max_tokens: 32768
    params: {temperature: 1.0, top_p: 0.95, top_k: 20}

  # The same with Strata's thinking budget (see thinkingcap-qwen3.8-flash-next-budget): a quarter of max_tokens
  # kept for the answer. oMLX takes it per request (`thinking_budget`) and only forces </think>, with no wrap-up
  # sentence. `-budget` is for livecodebench (24,576 of 32k), `-budget64k` for livecodebench-64k (49,152 of 64k).
  # `-budget-greedy` adds Strata's other difference: aibench sent it no sampling, so it decoded greedily.
  # Strata also stops a reply that repeats one token 256 times; nothing here does, so a greedy loop runs to
  # the budget. MTP id, as in the 50.0 / 73.3 runs these compare with.
  omlx-qwen3.8-flash-next-budget: &omlx-fn-budget
    backend: omlx
    id: qwen3.8-flash-next-oq4e-mtp
    gguf: ~/models/omlx
    max_tokens: 32768
    params: {temperature: 1.0, top_p: 0.95, top_k: 20, extra_body: {thinking_budget: 24576}}
  omlx-qwen3.8-flash-next-budget64k:
    <<: *omlx-fn-budget
    params: {temperature: 1.0, top_p: 0.95, top_k: 20, extra_body: {thinking_budget: 49152}}
  omlx-qwen3.8-flash-next-budget-greedy:
    <<: *omlx-fn-budget
    params: {temperature: 0.0, extra_body: {thinking_budget: 24576}}
  omlx-qwen3.8-flash-next-budget64k-greedy:   # with livecodebench-64k / livecodebench-60-64k
    <<: *omlx-fn-budget
    params: {temperature: 0.0, extra_body: {thinking_budget: 49152}}
  # 6-bit (mlx-community oQ6e-mtp, 150 GB) with the 32k budget + greedy, against the oQ4e's 88.3% on livecodebench-60.
  omlx-qwen3.8-flash-next-6bit-budget-greedy:
    <<: *omlx-fn-budget
    id: qwen3.8-flash-next-oq6e-mtp
    params: {temperature: 0.0, extra_body: {thinking_budget: 24576}}

  # Laguna S 2.1 (poolside, Jul 2026): 118B-A8B MoE for agentic coding, OpenMDW license; claims 70.2% on
  # Terminal-Bench 2.1. poolside's NVFP4 MLX build (72 GB) on oMLX (mlx_lm has `laguna`). Sampling and
  # thinking are its generation_config.json's; thinking is sent explicitly in case oMLX ignores the default
  # chat-template kwargs. The small XS 2.1 did badly on the R9700 (33.3% LCB, 77.8% terminal-x3).
  omlx-laguna-s-2.1:
    backend: omlx
    id: laguna-s-2.1-nvfp4
    gguf: ~/models/omlx
    max_tokens: 32768
    params: {temperature: 1.0, top_p: 1.0, top_k: 20, min_p: 0.0,
             extra_body: {chat_template_kwargs: {enable_thinking: true}}}

  # Flash-Next as agents get it: through the Mac's ai-swap (model qwen3.8-flash-next, oQ4e without MTP), with
  # greedy and the 24,576-token budget set as oMLX model settings (force_sampling, thinking_budget_tokens) rather
  # than per request. It sends an agent's usual sampling on purpose: force_sampling should override it.
  # flint as agents get it from ai-swap since 2026-11-24: Splash with the DFlash2 drafter, bf16 activations.
  swap-flint:
    backend: swap
    id: flint
    max_tokens: 32768
    params: {temperature: 1.0, top_p: 0.95, top_k: 20, keep_reasoning: true}
  swap-qwen3.8-flash-next:
    backend: swap
    id: qwen3.8-flash-next
    max_tokens: 32768
    params: {temperature: 1.0, top_p: 0.95, top_k: 20}

  # The two llama.cpp workhorses as oMLX oQ4e quants, to see whether oMLX's lead on Flash-Next holds for a dense
  # model and a small-active MoE. Same sampling as their llama.cpp entries. qwen3.8-27b runs with MTP (its embedded
  # head; llama.cpp uses an MTP drafter), flint without (no drafter on llama.cpp). MTP on/off is set per id in
  # ~/.omlx/model_settings.json; oMLX turns MTP on by default for any checkpoint that has MTP weights.
  omlx-qwen3.8-27b:
    backend: omlx
    id: qwen3.8-27b-oq4e-mtp          # Jundot/Qwen3.8-27B-oQ4e-mtp, 17.5 GB
    gguf: ~/models/omlx
    max_tokens: 32768
    params: {temperature: 0.6, top_p: 0.95, top_k: 20}
  omlx-flint:
    backend: omlx
    id: flint-oq4e                    # mlx-community/flint-oQ4e, 23.4 GB
    gguf: ~/models/omlx
    max_tokens: 32768
    params: {temperature: 1.0, top_p: 0.95, top_k: 20, keep_reasoning: true}

  # The same model at oMLX's 6-bit oQ6e (23.9 GB), to test whether oMLX's ~3-point LCB deficit against llama.cpp
  # comes from the 4-bit quant.
  omlx-qwen3.8-27b-6bit:
    backend: omlx
    id: qwen3.8-27b-oq6e-mtp          # Jundot/Qwen3.8-27B-oQ6e-mtp
    gguf: ~/models/omlx
    max_tokens: 32768
    params: {temperature: 0.6, top_p: 0.95, top_k: 20}

  # Splash (DFlash2 speculative decoding) on the two models ai-swap serves, as Unsloth's UD-Q4_K_XL GGUFs (Splash
  # has no MLX support for either). splash-flint uses flint's sampling, against flint (llama.cpp) and omlx-flint.
  # splash-qwen3.8-flash-next uses the best oMLX setting (greedy, 24,576-token thinking budget; Splash's request
  # field is thinking_token_budget), against omlx-qwen3.8-flash-next-budget-greedy. --ple-memory off keeps
  # Flash-Next's whole PLE table in RAM instead of streaming it from the SSD.
  splash-flint:
    backend: splash
    id: unsloth/flint-GGUF
    gguf: ~/models/flint/flint-UD-Q4_K_XL.gguf
    max_tokens: 32768
    params: {temperature: 1.0, top_p: 0.95, top_k: 20, keep_reasoning: true}
  # splash-flint scored 63.3% on livecodebench (llama.cpp 80%, oMLX 76.7%). This checks whether Splash's default
  # 8-bit activations cause the drop: its docs recommend bf16 for evaluations.
  splash-flint-bf16:
    backend: splash
    id: unsloth/flint-GGUF
    gguf: ~/models/flint/flint-UD-Q4_K_XL.gguf
    max_tokens: 32768
    params: {temperature: 1.0, top_p: 0.95, top_k: 20, keep_reasoning: true}
    args: [--activations, bf16]
  # flint on Splash 1.7.2, to check the upgrade before ai-swap moves: 1.7.2 applies each routed expert's
  # .scale in every MoE format and starts MoE SSD caches cold.
  splash172-flint-bf16:
    backend: splash-172
    id: unsloth/flint-GGUF
    gguf: ~/models/flint/flint-UD-Q4_K_XL.gguf
    max_tokens: 32768
    params: {temperature: 1.0, top_p: 0.95, top_k: 20, keep_reasoning: true}
    args: [--activations, bf16]
  # Inkling 2 Mini on Splash 1.7.2 with Inco's DFlash2 draft (incoai/Inkling-2-Mini-DFlash2, in the HF cache).
  # Unsloth's current root-layout UD-Q4_K_XL (re-uploaded; the R9700's copy is the older root layout).
  # Model-card sampling; reasoning effort medium as on the R9700 (Splash reads the top-level field).
  splash172-inkling-2-mini-medium:
    backend: splash-172
    id: unsloth/Inkling-2-Mini-GGUF
    gguf: ~/models/inkling-2-mini/Inkling-2-Mini-UD-Q4_K_XL.gguf
    max_tokens: 32768
    params:
      temperature: 1.0
      top_p: 1.0
      top_k: 0
      min_p: 0.0
      extra_body: {reasoning_effort: medium}
    args: [--activations, bf16]
  splash-qwen3.8-flash-next:
    backend: splash
    id: unsloth/Qwen3.8-Flash-Next-GGUF
    gguf: ~/models/qwen3.8-flash-next/UD-Q4_K_XL/Qwen3.8-Flash-Next-UD-Q4_K_XL-00001-of-00004.gguf
    max_tokens: 32768
    params: {temperature: 0.0, extra_body: {thinking_token_budget: 24576}}
    args: [--ple-memory, "off"]

  # oMLX 0.8.0 (2026-11-20). Inkling 2 Small (Thinking Machines, 594B / 17B active) as Hygaard's oQe 3.07 bpw
  # build with MTP (~210 GiB loaded), which needs the uploader's inkling2-affine-packed-width.patch applied to
  # oMLX (done by hand in the Homebrew install; a brew upgrade undoes it). No published sampling: Inkling-Small's.
  # MTP is off for it in ~/.omlx/model_settings.json (set by queues/mac-queue21.sh): the uploader tested MTP with
  # one request only, and these runs send 3-4 at once.
  omlx-inkling-2-small:
    backend: omlx
    id: inkling-2-small-oq3
    gguf: ~/models/omlx
    max_tokens: 32768
    params: {temperature: 1.0, top_p: 0.95}

  # DeepSeek V4.1 Flash (1017), Jundot's oQ2.5h (552B language model + 197B Engram n-gram tables + MTP; 319 GiB on
  # disk). The Engram tables stay on the SSD (deepseek_v41_engram_ssd_offload, set by queues/mac-queue21.sh), so
  # about 205 GiB is resident and it runs alone. ds4-q4's sampling. -budget adds the 24,576-token thinking budget
  # that lifted Flash-Next, with sampling kept (DeepSeek wasn't tried greedy).
  omlx-deepseek-v4.1-flash: &omlx-ds41
    backend: omlx
    id: deepseek-v4.1-flash-oq25h
    gguf: ~/models/omlx
    max_tokens: 32768
    params: {temperature: 1.0, top_p: 1.0}
    # Resident at ~206.6 GB even with Engram on the SSD; the default (balanced) guard then leaves ~0.1 GB
    # for prefill and rejected 59 of 60 prompts (2026-11-20). Aggressive keeps 1.5-4 GB free instead.
    args: [--memory-guard, aggressive]
  omlx-deepseek-v4.1-flash-budget:
    <<: *omlx-ds41
    params: {temperature: 1.0, top_p: 1.0, extra_body: {thinking_budget: 24576}}

suites:                     # copied from bench.yaml so the settings match exactly
  speed-quick:
    type: throughput
    prompt_tokens: [512, 8192]
    gen_tokens: 128
    repeats: 2
  speed-quick-eos:            # speed-quick without ignore_eos: ds4 allows it only at temperature 0, sushi only on
    type: throughput          # /v1/completions. The prompt asks for a long story, so 128 tokens are always reached.
    prompt_tokens: [512, 8192]
    gen_tokens: 128
    repeats: 2
    ignore_eos: false
  terminal-quick:             # agentic: bash/write_file tool calls in a Docker sandbox (copied from bench.yaml)
    type: terminal
    tasks: [log-error-report, kill-rogue, git-restore-file, csv-summary, fix-c-build, merge-conflict]
    concurrency: 3
  terminal-hard:              # 6 harder multi-step tasks (tasks/terminal-hard) x 3, for when terminal-x3 saturates
    type: terminal
    tasks_dir: tasks/terminal-hard
    builtin: false
    repeats: 3
    concurrency: 4
    max_turns: 40
    max_tokens: 32768
  terminal-x3:                # all 18 tasks x 3 episodes each (54 episodes)
    type: terminal
    repeats: 3
    concurrency: 4
    max_turns: 30
  speed-concurrent-eos:       # bench.yaml's speed-concurrent without ignore_eos (for sushi/ds4/oMLX), plus 8 in flight
    type: throughput
    prompt_tokens: [1024]
    gen_tokens: 256
    repeats: 2
    concurrency: [1, 2, 4, 8]
    ignore_eos: false
  humaneval-quick:
    type: humaneval-plus
    limit: 40
    concurrency: 4
  livecodebench:
    type: livecodebench
    release: v6
    sample: {medium: 15, hard: 15}
    concurrency: 4
  livecodebench-64k:          # same problems with twice the thinking budget (as on the R9700)
    type: livecodebench
    release: v6
    sample: {medium: 15, hard: 15}
    max_tokens_override: 65536
    concurrency: 3            # matches the R9700's run
  # 60 problems for head-to-heads the 30-problem sample can't separate (±9 points). Picks are evenly
  # spaced, so these 60 include the 30 above (every second pick).
  livecodebench-60:
    type: livecodebench
    release: v6
    sample: {medium: 30, hard: 30}
    concurrency: 4
  livecodebench-60-64k:
    type: livecodebench
    release: v6
    sample: {medium: 30, hard: 30}
    max_tokens_override: 65536
    concurrency: 3
  livecodebench-128k:         # 4x the original budget, for models still cut off at 64k (Mac only: needs the memory)
    type: livecodebench
    release: v6
    sample: {medium: 15, hard: 15}
    max_tokens_override: 131072
    concurrency: 3
  kernels:                    # raw llama.cpp speed on the GGUF, no server
    type: llama-bench
    binary: ~/.local/bin/llama-bench
    prompt_tokens: [512, 4096]
    gen_tokens: [128]
    args: [-ngl, 99, -fa, "on"]

profiles:
  mac: [speed-quick, humaneval-quick, livecodebench, kernels]   # kernels last: llama-bench stops the server
  mac-engine: [speed-quick, humaneval-quick, livecodebench]   # non-llama.cpp engines: no llama-bench
